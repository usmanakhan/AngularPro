<form #courseForm="ngForm" (ngSubmit)="formSubmit(courseForm.value)">
    <div class="form-group mb-3">
        <label for="courseName" class="form-label">Course Name</label>
        <input ngModel minlength="5" required name="courseName" id="courseName" #courseName="ngModel" type="text" class="form-control">
        <div *ngIf="courseName.touched && !courseName.valid" class="alert alert-danger">
            <div *ngIf="courseName.errors?.['required']">Course Name is Required</div>
            <div *ngIf="courseName.errors?.['minlength']">Min length {{courseName.errors?.['minlength'].requiredLength}}</div>
        </div>
    </div>
    <div class="form-group mb-3">
            <label for="courseCategory">Category</label>
            <select ngModel class="form-select" #courseCategory="ngModel" id="courseCategory" required name="courseCategory" aria-label="Course Category">
                <option *ngFor="let category of courseCategoryList" [ngValue]="category">{{category.name}}</option>
            </select>
            <div *ngIf="courseCategory.touched && !courseCategory.valid" class="alert alert-danger">
                    <div *ngIf="courseCategory.errors?.['required']">Category is Required</div>
                </div>
        </div>
        <div class="form-group mb-3">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" value="" ngModel id="isGuaranted" name="isGuaranted">
                    <label class="form-check-label" for="isGuaranted">
                        30 days money back guarantee
                    </label>
                </div>
            </div>
        <p>
            {{courseForm.value | json}}
        </p>
        <button class="btn btn-primary" [disabled]="!courseForm.valid">Submit</button>
</form>
