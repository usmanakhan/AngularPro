<form>
    <div class="form-group mb-3">
        <label for="firstName" class="form-label">First Name</label>
        <input ngModel minlength="3" maxlength="10" pattern="[A-Za-z]*" required name="firstName" id="firstName" #firstName="ngModel" type="text" class="form-control">
        <div *ngIf="firstName.touched && !firstName.valid" class="alert alert-danger">
            <div *ngIf="firstName.errors?.['required']">First Name is Required</div>
            <div *ngIf="firstName.errors?.['minlength']">Min length {{firstName.errors?.['minlength'].requiredLength}}</div>
            <div *ngIf="firstName.errors?.['pattern']">First Name format not match</div>
        </div>
    </div>
    <div class="form-group mb-3">
        <label for="comment" class="form-label">Comment</label>
        <textarea ngModel name="comment" id="comment" cols="30" rows="10" class="form-control"></textarea>
    </div>
    <button class="btn btn-primary">Submit</button>
</form>
