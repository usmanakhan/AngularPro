<form #myForm="ngForm" (ngSubmit)="formSubmit(myForm)">
    <div ngModelGroup="contact">
        <div class="form-group mb-3">
            <label for="firstName" class="form-label">First Name</label>
            <input ngModel minlength="3" maxlength="10" pattern="[A-Za-z]*" required name="firstName" id="firstName" #firstName="ngModel" type="text" class="form-control">
            <div *ngIf="firstName.touched && !firstName.valid" class="alert alert-danger">
                <div *ngIf="firstName.errors?.['required']">First Name is Required</div>
                <div *ngIf="firstName.errors?.['minlength']">Min length {{firstName.errors?.['minlength'].requiredLength}}</div>
                <div *ngIf="firstName.errors?.['pattern']">First Name format not match</div>
            </div>
        </div>
    </div>
    <div class="form-group mb-3">
        <label for="comment" class="form-label">Comment</label>
        <textarea ngModel name="comment" id="comment" cols="30" rows="10" class="form-control"></textarea>
    </div>
    <div class="form-group mb-3">
        <div class="form-check">
            <input class="form-check-input" type="checkbox" value="" ngModel id="isSubscribe" name="isSubscribe">
            <label class="form-check-label" for="isSubscribe">
                Subscribe to mail
            </label>
        </div>
    </div>
    <div class="form-group mb-3">
        <div class="form-check" *ngFor="let method of contactMethodList">
            <input class="form-check-input" ngModel type="radio" name="contactMethod" [value]="method.id" id="contPhone">
            <label class="form-check-label" for="contPhone">
              {{method.name}}
            </label>
        </div>
    </div>
    <div class="form-group mb-3">
        <label for="contactMethod">Contact Method</label>
        <select class="form-select" ngModel id="contactMethod" name="contactMethod" aria-label="Default select example">
            <option *ngFor="let method of contactMethodList" [ngValue]="method">{{method.name}}</option>
        </select>
    </div>
    <p>
        {{myForm.value | json}}
    </p>
    <button class="btn btn-primary" [disabled]="!myForm.valid">Submit</button>
</form>
